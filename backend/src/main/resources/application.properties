spring.application.name=shuttle-backend

# Local MySQL configuration. Replace the password or set DB_PASSWORD in your environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srm_shuttle}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates/updates tables for the entities in this learning project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Set these environment variables when deploying. The defaults are for local development only.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:bXktc3JtLXNodXR0bGUtZGV2LXNlY3JldC1rZXktMzItYnl0ZXM=}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
